server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d

app:
  minimised-http-servlet-logging: true
  cookie:
    secure: true
    same-site: Lax
  console:
    owner-emails: ${CONSOLE_OWNER_EMAILS:artiom.diulgher@gmail.com}
    admin-emails: ${CONSOLE_ADMIN_EMAILS:}
    max-page-size: 100
  retention:
    audit:
      retention-days: 14
      cron: "0 30 3 * * *"
  replay-collector:
    base-url: https://gentool.net/data/
    game: zh
    request-delay: 150ms
    request-timeout: 20s
    max-text-file-size: 64KB
    max-days-per-job: 31
    user-agent: gentool-data-viewer/1.0
    schedule-enabled: true
    schedule-cron: "0 15 2 * * *"
    schedule-zone: UTC
  cpu-benchmark:
    base-url: https://www.cpubenchmark.net/single-thread/
    max-pages: 8
    request-delay: 750ms
    request-timeout: 20s
    user-agent: gentool-data-viewer/1.0 (+CPU benchmark catalog sync)
    schedule-enabled: true
    schedule-cron: "0 30 4 * * SUN"
    schedule-zone: UTC

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      cache:
        time-to-live: 60s
      group:
        external:
          include: google
    prometheus:
      enabled: true
  info:
    git:
      enabled: false
    build:
      enabled: false
  metrics:
    tags:
      application: fullstack-starter

spring:
  profiles:
    group:
      local: plain-log,active-properties-logging
      stage: postgres-container,prod-google
      prod: postgres-container,prod-google
  application:
    name: fullstack-starter
  session:
    jdbc:
      initialize-schema: never

logging:
  structured:
    format:
      console: logstash
    json:
      add:
        git_commit: "@git.commit.id.abbrev@"
        app_version: "@project.version@"
        service: ${spring.application.name}
      stacktrace:
        root: first
        max-length: 2048
        include-common-frames: false
        include-hashes: true
  level:
    WireMock: warn
