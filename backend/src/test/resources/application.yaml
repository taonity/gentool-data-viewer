server:
  port: 8080
  forward-headers-strategy: native
  servlet:
    session:
      timeout: 7d
      cookie:
        domain: 127.0.0.1
        name: JSESSIONID-TEST

spring:
  main:
    allow-bean-definition-overriding: true
  profiles:
    group:
      local: plain-log,active-properties-logging
      stage: postgres-container,prod-google
      prod: postgres-container,prod-google
  security:
    oauth2:
      client:
        registration:
          google-fullstack-starter:
            provider: google
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            redirect-uri: http://127.0.0.1:8080/login/oauth2/code/google-fullstack-starter
            authorization-grant-type: authorization_code
            scope: openid,profile,email
        provider:
          google:
            authorization-uri: http://127.0.0.1:9561/oauth2/authorize
            token-uri: http://127.0.0.1:9561/oauth2/token
            user-info-uri: http://127.0.0.1:9561/oauth2/v3/userinfo

app:
  minimised-http-servlet-logging: false
  default-success-url: /
  login-url: /
  csrf-cookie-name: XSRF-TOKEN-TEST
  cookie:
    secure: false
    same-site: Lax
  console:
    max-page-size: 100
  retention:
    audit:
      retention-days: 14
      cron: "0 30 3 * * *"
  replay-collector:
    base-url: https://gentool.net/data/
    game: zh
    request-delay: 0ms
    request-timeout: 1s
    max-text-file-size: 64KB
    max-days-per-job: 31
    user-agent: gentool-data-viewer-test/1.0
    schedule-enabled: false
    schedule-cron: "0 15 2 * * *"
    schedule-zone: UTC
  cpu-benchmark:
    base-url: https://www.cpubenchmark.net/single-thread/
    max-pages: 8
    request-delay: 0ms
    request-timeout: 1s
    user-agent: gentool-data-viewer-test/1.0
    schedule-enabled: false
    schedule-cron: "0 30 4 * * SUN"
    schedule-zone: UTC

